<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 15px; margin: 5px; }
        #results { background: #f5f5f5; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Frontend Authentication Test</h1>
    
    <div class="test-section">
        <h3>1. Health Check</h3>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <div id="health-result"></div>
    </div>

    <div class="test-section">
        <h3>2. Login Test</h3>
        <input type="text" id="identifier" placeholder="Email or Phone" value="test@example.com">
        <input type="password" id="password" placeholder="Password" value="testpassword123">
        <button onclick="testLogin()">Test Login</button>
        <div id="login-result"></div>
    </div>

    <div class="test-section">
        <h3>3. Profile Test</h3>
        <button onclick="testProfile()">Test Profile Endpoint</button>
        <div id="profile-result"></div>
    </div>

    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:5000';
        
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
            console.log(message);
        }

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            try {
                log('Testing health endpoint...');
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<span class="success">✅ Health check passed: ${data.message}</span>`;
                    log('Health check successful', 'success');
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ Health check failed: ${data.message}</span>`;
                    log('Health check failed', 'error');
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Network error: ${error.message}</span>`;
                log(`Health check error: ${error.message}`, 'error');
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;
            
            try {
                log('Testing login...');
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ identifier, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    resultDiv.innerHTML = `<span class="success">✅ Login successful! User: ${data.data.user.email}</span>`;
                    log('Login successful', 'success');
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ Login failed: ${data.error?.message || 'Unknown error'}</span>`;
                    log(`Login failed: ${data.error?.message}`, 'error');
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Network error: ${error.message}</span>`;
                log(`Login error: ${error.message}`, 'error');
            }
        }

        async function testProfile() {
            const resultDiv = document.getElementById('profile-result');
            
            try {
                log('Testing profile endpoint...');
                const response = await fetch(`${API_BASE}/api/users/profile`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    resultDiv.innerHTML = `<span class="success">✅ Profile retrieved! User: ${data.data.user.email}</span>`;
                    log('Profile retrieval successful', 'success');
                } else if (response.status === 401) {
                    resultDiv.innerHTML = `<span class="error">❌ Not authenticated (expected if not logged in)</span>`;
                    log('Profile access denied - not authenticated', 'error');
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ Profile failed: ${data.error?.message || 'Unknown error'}</span>`;
                    log(`Profile error: ${data.error?.message}`, 'error');
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Network error: ${error.message}</span>`;
                log(`Profile error: ${error.message}`, 'error');
            }
        }

        // Auto-run health check on load
        window.onload = () => {
            testHealth();
        };
    </script>
</body>
</html>
