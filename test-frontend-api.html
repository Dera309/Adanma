<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; font-family: monospace; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔧 Frontend API Connection Test</h1>
    
    <div class="test-section">
        <h3>Test Results</h3>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="clearResults()">Clear Results</button>
        <div id="results"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:5000';
        
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Create axios instance like in the frontend
        const api = axios.create({
            baseURL: API_BASE + '/api',
            timeout: 15000,
            withCredentials: true,
            headers: {
                'Content-Type': 'application/json',
            },
            validateStatus: (status) => status < 500,
        });
        
        // Add request interceptor
        api.interceptors.request.use(
            (config) => {
                config.headers['X-Correlation-ID'] = Math.random().toString(36).substr(2, 9);
                config.headers['Origin'] = window.location.origin;
                console.log(`Making ${config.method?.toUpperCase()} request to ${config.url}`);
                return config;
            },
            (error) => {
                console.error('Request error:', error);
                return Promise.reject(error);
            }
        );
        
        // Add response interceptor
        api.interceptors.response.use(
            (response) => {
                console.log(`Response: ${response.status} ${response.statusText}`);
                return response;
            },
            (error) => {
                if (error.request) {
                    console.group('🔧 Network Error Details');
                    console.error('Error:', error.message);
                    console.error('Code:', error.code);
                    console.error('Config:', error.config);
                    console.groupEnd();
                }
                return Promise.reject(error);
            }
        );
        
        async function testBackendHealth() {
            addResult('Testing backend health...', 'info');
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    const data = await response.json();
                    addResult(`✅ Backend health: ${data.message}`, 'success');
                    return true;
                } else {
                    addResult(`❌ Backend health failed: ${response.status}`, 'error');
                    return false;
                }
            } catch (error) {
                addResult(`❌ Backend health error: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function testLogin() {
            addResult('Testing login with axios...', 'info');
            try {
                const response = await api.post('/auth/login', {
                    identifier: 'test@example.com',
                    password: 'testpassword123'
                });
                
                if (response.data.success) {
                    addResult(`✅ Login successful: ${response.data.message}`, 'success');
                } else {
                    addResult(`❌ Login failed: ${response.data.error?.message}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Login error: ${error.message || error.error?.message}`, 'error');
                console.error('Full login error:', error);
            }
        }
        
        async function testLogout() {
            addResult('Testing logout...', 'info');
            try {
                const response = await api.post('/auth/logout');
                addResult(`✅ Logout successful`, 'success');
            } catch (error) {
                addResult(`❌ Logout error: ${error.message || error.error?.message}`, 'error');
            }
        }
        
        async function runAllTests() {
            clearResults();
            addResult('Starting comprehensive API tests...', 'info');
            
            const healthOk = await testBackendHealth();
            
            if (healthOk) {
                await testLogin();
                await testLogout();
                addResult('All tests completed!', 'info');
            } else {
                addResult('Skipping other tests due to backend health failure', 'error');
            }
        }
        
        // Auto-run on page load
        window.addEventListener('load', () => {
            addResult('Page loaded. Click "Run All Tests" to start testing.', 'info');
        });
    </script>
</body>
</html>
