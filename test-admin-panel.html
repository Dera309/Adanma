<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        button { padding: 10px; margin: 5px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .stat-card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <h1>Admin Panel Test</h1>
    <div id="results"></div>
    
    <button onclick="testAdminEndpoint()">Test Admin Stats (No Auth)</button>
    <button onclick="testWithMockAuth()">Test Admin Stats (Mock Auth)</button>
    
    <div id="stats-display"></div>
    
    <script>
        const API_URL = 'http://localhost:5002';
        const results = document.getElementById('results');
        const statsDisplay = document.getElementById('stats-display');
        
        function log(message, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = message;
            results.appendChild(p);
        }
        
        async function testAdminEndpoint() {
            try {
                log('Testing admin stats endpoint without authentication...', 'info');
                
                const response = await fetch(`${API_URL}/api/admin/stats`);
                const data = await response.json();
                
                if (response.status === 401) {
                    log('✅ Authentication properly required', 'success');
                    log(`Response: ${data.error.message}`, 'info');
                } else {
                    log('❌ Authentication not properly enforced', 'error');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function testWithMockAuth() {
            try {
                log('Testing admin stats with mock authentication...', 'info');
                
                // Create a mock JWT token (this won't work in real scenario)
                const mockToken = 'mock-admin-token';
                
                const response = await fetch(`${API_URL}/api/admin/stats`, {
                    headers: {
                        'Authorization': `Bearer ${mockToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    log('✅ Admin stats endpoint responding', 'success');
                    displayStats(data.data);
                    if (data.meta?.mockData) {
                        log('📊 Using mock data (expected in development)', 'info');
                    }
                } else {
                    log(`❌ Admin stats failed: ${data.error?.message || 'Unknown error'}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        function displayStats(stats) {
            statsDisplay.innerHTML = `
                <h3>Admin Statistics</h3>
                <div class="stats">
                    <div class="stat-card">
                        <h4>Total Users</h4>
                        <div>${stats.totalUsers.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Total Orders</h4>
                        <div>${stats.totalOrders.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Total Revenue</h4>
                        <div>$${stats.totalRevenue.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Active Vendors</h4>
                        <div>${stats.activeVendors.toLocaleString()}</div>
                    </div>
                </div>
            `;
        }
        
        // Test basic connectivity on load
        window.onload = async () => {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                if (data.status === 'ok') {
                    log('✅ Backend server is running and healthy', 'success');
                } else {
                    log('⚠️ Backend server responding but may have issues', 'error');
                }
            } catch (error) {
                log('❌ Cannot connect to backend server', 'error');
            }
        };
    </script>
</body>
</html>
