<!DOCTYPE html>
<html>
<head>
    <title>Registration Test</title>
</head>
<body>
    <h1>Registration Test</h1>
    
    <h2>Email Registration</h2>
    <form id="emailForm">
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Password" required><br><br>
        <input type="checkbox" id="terms" required> Accept Terms<br><br>
        <button type="submit">Register with Email</button>
    </form>
    
    <h2>Phone Registration</h2>
    <form id="phoneForm">
        <input type="tel" id="phone" placeholder="+2348012345678" required><br><br>
        <input type="password" id="phonePassword" placeholder="Password" required><br><br>
        <input type="checkbox" id="phoneTerms" required> Accept Terms<br><br>
        <button type="submit">Register with Phone</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const result = document.getElementById('result');
            
            try {
                const response = await fetch(`${API_BASE}/auth/register/email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        acceptedTerms: document.getElementById('terms').checked
                    })
                });
                
                const data = await response.json();
                result.innerHTML = `<h3>Email Registration Result:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.innerHTML = `<h3>Email Registration Error:</h3><pre>${error.message}</pre>`;
            }
        });
        
        document.getElementById('phoneForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const result = document.getElementById('result');
            
            try {
                const response = await fetch(`${API_BASE}/auth/register/phone`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phoneNumber: document.getElementById('phone').value,
                        password: document.getElementById('phonePassword').value,
                        acceptedTerms: document.getElementById('phoneTerms').checked
                    })
                });
                
                const data = await response.json();
                result.innerHTML = `<h3>Phone Registration Result:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.innerHTML = `<h3>Phone Registration Error:</h3><pre>${error.message}</pre>`;
            }
        });
    </script>
</body>
</html>
